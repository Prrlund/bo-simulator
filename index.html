<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bo simulator</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Bo simulator: ett litet spel om Bo, 19 år. Häng med Tilde, gymma, spela PUBG, ät ofta och undvik stress, ångest, oro och flunsa." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topp">
    <h1><span class="logo" id="logo"></span>Bo simulator</h1>
    <div class="hud">
      <div class="hjartan" id="hjartan" aria-label="Hjärtan"></div>
      <div class="poang" aria-live="polite"><span id="poang">0</span><small>/19</small></div>
      <div class="matare">
        <div class="stapel" title="Energi"><span>Energi</span><div class="stapel-ram"><div id="energi" class="stapel-fyll energi"></div></div></div>
        <div class="stapel" title="Mätt"><span>Mätt</span><div class="stapel-ram"><div id="matt" class="stapel-fyll matt"></div></div></div>
      </div>
    </div>
  </header>

  <main>
    <div class="karta-ram">
      <div id="karta" class="karta" role="grid" aria-label="Spelkartan"></div>
      <div id="lager" class="lager" aria-hidden="true"></div>
      <div id="meddelande" class="meddelande" aria-live="assertive"></div>
    </div>
    <div id="hot" class="hot"></div>
    <p class="hjalp">Gå med <b>piltangenterna</b> eller <b>WASD</b>, eller tryck på ett ställe på kartan. Spelet står still medan Bo gör något.</p>
    <section class="lista">
      <h2>Saker Bo kan göra</h2>
      <ul id="lista"></ul>
    </section>
  </main>

  <div id="ruta" class="ruta" hidden>
    <div class="ruta-inre" role="dialog" aria-modal="true" aria-labelledby="rutaTitel">
      <div class="ruta-ikon" id="rutaIkon"></div>
      <h2 id="rutaTitel"></h2>
      <p id="rutaText"></p>
      <div id="rutaSpel"></div>
      <div class="ruta-knappar" id="rutaKnappar"></div>
    </div>
  </div>

  <div id="konfetti" class="konfetti" aria-hidden="true"></div>
  <script src="ikoner.js"></script>
  <script src="game.js"></script>
</body>
</html>
